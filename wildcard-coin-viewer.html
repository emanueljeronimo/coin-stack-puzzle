<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comodin — vista previa</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      /* Color de la ficha. Cambialo aca o con el picker. No afecta el juego. */
      --ficha-color: #00ffee;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: "Segoe UI", sans-serif;
      color: #0505e9;
      background: linear-gradient(180deg, #eef1f6, #d7dde8);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 400;
    }

    p {
      margin: 0;
      max-width: 520px;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      color: #0048ff;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #2a2a32;
    }

    .controls input[type="color"] {
      width: 42px;
      height: 32px;
      padding: 0;
      border: 1px solid #9aa3b2;
      background: #fff;
      cursor: pointer;
    }

    .controls input[type="text"] {
      width: 96px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #9aa3b2;
      border-radius: 4px;
      font: inherit;
      letter-spacing: 0.04em;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 48px;
    }

    .coin-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .coin-wrap span {
      font-size: 13px;
      color: #0f48d8;
    }

    .coin {
      position: relative;
      width: var(--side);
      height: var(--side);
      filter: drop-shadow(0 2px 0 rgba(91, 4, 161, 0.18));
    }

    .coin .tex {
      display: block;
      width: 100%;
      height: 100%;
    }

    .coin .center {
      position: absolute;
      z-index: 2;
      width: 48%;
      height: 45%;
      left: 25%;
      top: 25%;
      object-fit: contain;
      pointer-events: none;
    }

    .big { --side: 280px; }
    .board { --side: 104px; }
  </style>
</head>
<body>
  <h1>Ficha comodin</h1>
  <p>
    Cambiá <code>--ficha-color</code> o usá el picker. Solo este HTML, no el juego.
  </p>
  <label class="controls">
    Color de la ficha
    <input id="ficha-color" type="color" value="#dcdce1" />
    <input id="ficha-hex" type="text" value="#dcdce1" spellcheck="false" />
  </label>
  <div class="row">
    <div class="coin-wrap">
      <div class="coin big">
        <canvas class="tex"></canvas>
        <img class="center" src="Imagenes/centro-comodin.png" alt="" />
      </div>
      <span>grande</span>
    </div>
    <div class="coin-wrap">
      <div class="coin board">
        <canvas class="tex"></canvas>
        <img class="center" src="Imagenes/centro-comodin.png" alt="" />
      </div>
      <span>tamano tablero</span>
    </div>
  </div>
  <script>
    const fichaImg = new Image();
    const colorInput = document.getElementById("ficha-color");
    const hexInput = document.getElementById("ficha-hex");

    function fichaColor() {
      return getComputedStyle(document.documentElement)
        .getPropertyValue("--ficha-color")
        .trim() || "#dcdce1";
    }

    function paint(canvas) {
      const ctx = canvas.getContext("2d");
      canvas.width = fichaImg.naturalWidth;
      canvas.height = fichaImg.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(fichaImg, 0, 0);
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = fichaColor();
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(fichaImg, 0, 0);
      ctx.globalCompositeOperation = "source-over";
    }

    function paintAll() {
      document.querySelectorAll("canvas.tex").forEach(paint);
    }

    function setColor(value) {
      const color = value.trim();
      if (!/^#([0-9a-fA-F]{6})$/.test(color)) {
        return;
      }
      document.documentElement.style.setProperty("--ficha-color", color);
      colorInput.value = color;
      hexInput.value = color;
      paintAll();
    }

    colorInput.addEventListener("input", function () {
      setColor(colorInput.value);
    });
    hexInput.addEventListener("change", function () {
      setColor(hexInput.value);
    });
    hexInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        setColor(hexInput.value);
      }
    });

    fichaImg.onload = paintAll;
    fichaImg.src = "Imagenes/ficha.png";
  </script>
</body>
</html>

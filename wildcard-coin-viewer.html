<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comodin — vista previa</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      font-family: "Segoe UI", sans-serif;
      color: #2a2a32;
      background: linear-gradient(180deg, #eef1f6, #d7dde8);
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 400;
    }

    p {
      margin: 0;
      max-width: 520px;
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
      color: #4a4e58;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 48px;
    }

    .coin-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .coin-wrap span {
      font-size: 13px;
      color: #5a5e68;
    }

    .coin {
      position: relative;
      width: var(--side);
      height: var(--side);
      filter: drop-shadow(0 2px 0 rgba(150, 118, 40, 0.22));
    }

    .coin .tex {
      display: block;
      width: 100%;
      height: 100%;
    }

    .big { --side: 240px; }
    .board { --side: 89px; }
  </style>
</head>
<body>
  <h1>Ficha comodin</h1>
  <p>
    Usa <strong>ficha-comodin</strong> y el barrido de luz en diagonal.
  </p>
  <div class="row">
    <div class="coin-wrap">
      <div class="coin big">
        <canvas class="tex"></canvas>
      </div>
      <span>grande</span>
    </div>
    <div class="coin-wrap">
      <div class="coin board">
        <canvas class="tex"></canvas>
      </div>
      <span>tamano tablero</span>
    </div>
  </div>
  <script>
    const SWEEP_DURATION = 0.8;
    const SWEEP_PERIOD = 3.6;
    const fichaImg = new Image();
    let start = 0;

    function paint(canvas, t) {
      const ctx = canvas.getContext("2d");
      const w = fichaImg.naturalWidth;
      const h = fichaImg.naturalHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(fichaImg, 0, 0);
      const phase = t % SWEEP_PERIOD;
      if (phase < SWEEP_DURATION) {
        const u = phase / SWEEP_DURATION;
        const len = Math.sqrt(w * w + h * h);
        const pos = (-0.28 + u * 1.56) * len;
        const half = len * 0.12;
        const fade = Math.min(u / 0.08, 1) * Math.min((1 - u) / 0.08, 1);
        ctx.save();
        ctx.translate(w * 0.5, h * 0.5);
        ctx.rotate(Math.PI / 4);
        const g = ctx.createLinearGradient(pos - half, 0, pos + half, 0);
        g.addColorStop(0, "rgba(255, 255, 247, 0)");
        g.addColorStop(0.32, "rgba(255, 255, 247, " + (0.10 * fade).toFixed(3) + ")");
        g.addColorStop(0.5, "rgba(255, 255, 247, " + (0.28 * fade).toFixed(3) + ")");
        g.addColorStop(0.68, "rgba(255, 255, 247, " + (0.10 * fade).toFixed(3) + ")");
        g.addColorStop(1, "rgba(255, 255, 247, 0)");
        ctx.globalCompositeOperation = "screen";
        ctx.fillStyle = g;
        ctx.fillRect(-len, -len, len * 2, len * 2);
        ctx.restore();
      }
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(fichaImg, 0, 0);
      ctx.globalCompositeOperation = "source-over";
    }

    function frame(now) {
      if (!start) {
        start = now;
      }
      const t = (now - start) / 1000;
      document.querySelectorAll("canvas.tex").forEach(function (canvas) {
        paint(canvas, t);
      });
      requestAnimationFrame(frame);
    }

    fichaImg.onload = function () {
      requestAnimationFrame(frame);
    };
    fichaImg.src = "Imagenes/ficha-comodin.png";
  </script>
</body>
</html>
